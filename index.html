<script>
        // ========================================
        // CHARGEMENT DES DONNÉES
        // ========================================
        async function loadData() {
            try {
                // Charger le catalogue
                const catalogResponse = await fetch('data.json');
                if (!catalogResponse.ok) throw new Error('Impossible de charger le catalogue');
                CATALOG = await catalogResponse.json();
                DISCOUNT_PER_EXTRA = CATALOG.remise?.par_quantite || 500;
                MAX_QUANTITY = CATALOG.remise?.quantite_max || 10;
                document.getElementById('discount-info').textContent = 
                    `Réduction de ${DISCOUNT_PER_EXTRA} DA par quantité supplémentaire (max ${MAX_QUANTITY})`;

                // Charger les wilayas
                const wilayaResponse = await fetch('cities.json');
                if (!wilayaResponse.ok) throw new Error('Impossible de charger les wilayas');
                const wilayaData = await wilayaResponse.json();
                WILAYA_DATAS = wilayaData;
                WILAYA_NAMES = wilayaData.wilayas || [];

                // Construire la liste des modèles
                buildModelList();

                // Initialiser les champs
                initWilayaSelect();
                initSearchFields();
                updateStep2();

                document.getElementById('step1-next').disabled = false;

            } catch (error) {
                console.error('Erreur:', error);
                showStatus('error', '⚠️ Erreur de chargement: ' + error.message);
            }
        }

        function buildModelList() {
            allModeles = [];
            if (!CATALOG || !CATALOG.marques) return;
            
            CATALOG.marques.forEach(marque => {
                if (!marque.toners) return;
                marque.toners.forEach(toner => {
                    if (!toner.compatibles) return;
                    toner.compatibles.forEach(model => {
                        allModeles.push({
                            marque: marque.nom,
                            modele: model,
                            toner: toner,
                            marqueObj: marque
                        });
                    });
                });
            });
        }

        // ========================================
        // WILAYAS & COMMUNES
        // ========================================
        function initWilayaSelect() {
            const select = document.getElementById('order-wilaya');
            select.innerHTML = '<option value="">Sélectionnez votre wilaya</option>';
            WILAYA_NAMES.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.wilaya_id;
                opt.textContent = w.wilaya_name_latin;
                select.appendChild(opt);
            });
            select.addEventListener('change', function() {
                loadCommunes(this.value);
            });
        }

        function loadCommunes(wilayaId) {
            const communeSelect = document.getElementById('order-commune');
            const loading = document.getElementById('communeLoading');
            
            communeSelect.innerHTML = '<option value="">Sélectionnez une commune</option>';
            
            if (!wilayaId) {
                communeSelect.disabled = true;
                return;
            }
            
            communeSelect.disabled = true;
            loading.style.display = 'block';
            
            setTimeout(() => {
                const communes = WILAYA_DATAS.communes?.filter(c => c.wilaya_id == wilayaId) || [];
                communes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.commune_id;
                    opt.textContent = c.commune_name_latin || c.commune_name_arabic;
                    communeSelect.appendChild(opt);
                });
                communeSelect.disabled = false;
                loading.style.display = 'none';
            }, 300);
        }

        // ========================================
        // RECHERCHE
        // ========================================
        function initSearchFields() {
            // Référence
            const refInput = document.getElementById('recherche-reference');
            const refSuggest = document.getElementById('suggestions-reference');
            
            refInput.addEventListener('input', debounce(function() {
                const val = this.value.trim();
                if (val.length < 2) {
                    refSuggest.style.display = 'none';
                    return;
                }
                const results = searchByReference(val);
                showSuggestions(refSuggest, results.map(r => ({
                    label: `${r.toner.nom} (${r.toner.code}) - ${r.marque}`,
                    sub: r.modele,
                    data: { marque: r.marque, modele: r.modele, toner: r.toner }
                })), (item) => {
                    selectToner(item.data);
                    refSuggest.style.display = 'none';
                    refInput.value = item.label;
                });
                refSuggest.style.display = results.length > 0 ? 'block' : 'none';
            }, 300));

            // Marque
            const marqueInput = document.getElementById('recherche-marque');
            const marqueSuggest = document.getElementById('suggestions-marque');
            
            marqueInput.addEventListener('input', debounce(function() {
                const val = this.value.trim();
                if (val.length < 2) {
                    marqueSuggest.style.display = 'none';
                    document.getElementById('recherche-modele').disabled = true;
                    return;
                }
                const marques = getMarquesFiltered(val);
                showSuggestions(marqueSuggest, marques.map(m => ({
                    label: m.nom,
                    sub: `${m.toners?.length || 0} toners disponibles`,
                    data: { marque: m }
                })), (item) => {
                    document.getElementById('marque-selectionnee').value = item.data.marque.nom;
                    marqueInput.value = item.data.marque.nom;
                    marqueSuggest.style.display = 'none';
                    enableModeleSearch(item.data.marque);
                });
                marqueSuggest.style.display = marques.length > 0 ? 'block' : 'none';
            }, 300));

            // Modèle
            const modeleInput = document.getElementById('recherche-modele');
            const modeleSuggest = document.getElementById('suggestions-modele');
            
            modeleInput.addEventListener('input', debounce(function() {
                const val = this.value.trim();
                const marque = document.getElementById('marque-selectionnee').value;
                if (val.length < 2 || !marque) {
                    modeleSuggest.style.display = 'none';
                    return;
                }
                const results = searchModels(val, marque);
                showSuggestions(modeleSuggest, results.map(r => ({
                    label: r.modele,
                    sub: `${r.toner.nom} - ${r.toner.code}`,
                    data: { marque: r.marque, modele: r.modele, toner: r.toner }
                })), (item) => {
                    selectToner(item.data);
                    modeleSuggest.style.display = 'none';
                    modeleInput.value = item.data.modele;
                });
                modeleSuggest.style.display = results.length > 0 ? 'block' : 'none';
            }, 300));

            // Clic en dehors des suggestions
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#suggestions-reference')) {
                    document.getElementById('suggestions-reference').style.display = 'none';
                }
                if (!e.target.closest('#suggestions-marque')) {
                    document.getElementById('suggestions-marque').style.display = 'none';
                }
                if (!e.target.closest('#suggestions-modele')) {
                    document.getElementById('suggestions-modele').style.display = 'none';
                }
            });
        }

        function searchByReference(query) {
            const q = query.toLowerCase().trim();
            const results = [];
            allModeles.forEach(item => {
                const code = (item.toner.code || '').toLowerCase();
                const nom = (item.toner.nom || '').toLowerCase();
                if (code.includes(q) || nom.includes(q)) {
                    results.push(item);
                }
            });
            return results.slice(0, 15);
        }

        function getMarquesFiltered(query) {
            const q = query.toLowerCase().trim();
            return (CATALOG.marques || []).filter(m => 
                m.nom.toLowerCase().includes(q) || 
                (m.aliases || []).some(a => a.toLowerCase().includes(q))
            );
        }

        function searchModels(query, marque) {
            const q = query.toLowerCase().trim();
            return allModeles.filter(item => 
                item.marque.toLowerCase() === marque.toLowerCase() &&
                item.modele.toLowerCase().includes(q)
            ).slice(0, 15);
        }

        function enableModeleSearch(marque) {
            const modeleInput = document.getElementById('recherche-modele');
            modeleInput.disabled = false;
            modeleInput.placeholder = `Rechercher un modèle ${marque.nom}...`;
            modeleInput.value = '';
            document.getElementById('suggestions-modele').style.display = 'none';
        }

        function showSuggestions(container, items, onSelect) {
            container.innerHTML = '';
            if (items.length === 0) {
                container.style.display = 'none';
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<span>${item.label}</span><span class="sub-info">${item.sub || ''}</span>`;
                div.addEventListener('click', () => onSelect(item));
                container.appendChild(div);
            });
            container.style.display = 'block';
        }

        function selectToner(data) {
            const { marque, modele, toner } = data;
            
            // Mettre à jour les champs
            document.getElementById('marque-selectionnee').value = marque;
            document.getElementById('modele-selectionne').value = modele;
            document.getElementById('recherche-marque').value = marque;
            document.getElementById('recherche-modele').value = modele;
            
            // Mettre à jour le produit
            updateProductDisplay(marque, modele, toner);
            
            // Activer le bouton continuer
            document.getElementById('step1-next').disabled = false;
            
            // Passer à l'étape 2 automatiquement après un court délai
            setTimeout(() => {
                showStep(2);
            }, 500);
        }

        // ========================================
        // AFFICHAGE PRODUIT
        // ========================================
        function updateProductDisplay(marque, modele, toner) {
            const nom = document.getElementById('product-name');
            const code = document.getElementById('product-code');
            const price = document.getElementById('product-price');
            const rendement = document.getElementById('product-rendement');
            const desc = document.getElementById('product-desc');
            const compat = document.getElementById('compat-list');
            
            nom.textContent = `${marque} - ${toner.nom}`;
            code.textContent = `Réf: ${toner.code}`;
            rendement.textContent = `📄 Rendement: ${toner.rendement}`;
            desc.textContent = `Compatible avec ${modele}`;
            
            // Prix
            UNIT_PRICE = toner.prix_compatible || 7500;
            price.textContent = `${UNIT_PRICE.toLocaleString('fr-FR')} DA`;
            
            // Compatibilités
            compat.innerHTML = '';
            if (toner.compatibles) {
                toner.compatibles.forEach(m => {
                    const span = document.createElement('span');
                    span.textContent = m;
                    compat.appendChild(span);
                });
            }
            
            // Stocker les données
            document.getElementById('step2-next').dataset.toner = JSON.stringify(toner);
            document.getElementById('step2-next').dataset.marque = marque;
            document.getElementById('step2-next').dataset.modele = modele;
            
            updatePrice();
        }

        // ========================================
        // GESTION DES ÉTAPES
        // ========================================
        function showStep(step) {
            // Cacher tous les steps
            document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
            // Afficher le step demandé
            document.getElementById(`step${step}`).classList.add('active');
            
            // Mettre à jour la barre de progression
            document.querySelectorAll('.step-item').forEach(el => {
                const num = parseInt(el.dataset.step);
                el.classList.remove('active', 'done');
                if (num === step) el.classList.add('active');
                else if (num < step) el.classList.add('done');
            });
            
            // Mettre à jour le prix si on est à l'étape 2
            if (step === 2) updatePrice();
            
            // Scroll en haut du formulaire
            document.querySelector('.order-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ========================================
        // GESTION DU PRIX
        // ========================================
        function updatePrice() {
            const qty = parseInt(document.getElementById('quantity').value) || 1;
            const type = selectedTonerType;
            const basePrice = type === 'compatible' ? UNIT_PRICE : (UNIT_PRICE * 2.2); // approx original
            
            let total = basePrice * qty;
            let discount = 0;
            
            if (qty > 1) {
                discount = (qty - 1) * DISCOUNT_PER_EXTRA;
                total = total - discount;
                if (total < 0) total = 0;
            }
            
            document.getElementById('subtotal-display').textContent = `${(basePrice * qty).toLocaleString('fr-FR')} DA`;
            
            const discountLine = document.getElementById('discount-line');
            const discountDisplay = document.getElementById('discount-display');
            if (discount > 0) {
                discountLine.style.display = 'flex';
                discountDisplay.textContent = `-${discount.toLocaleString('fr-FR')} DA`;
            } else {
                discountLine.style.display = 'none';
            }
            
            document.getElementById('total-display').textContent = `${total.toLocaleString('fr-FR')} DA`;
            
            // Animation
            const totalEl = document.getElementById('total-display');
            totalEl.classList.remove('price-blink');
            void totalEl.offsetWidth;
            totalEl.classList.add('price-blink');
        }

        // ========================================
        // GESTION DES ÉVÉNEMENTS
        // ========================================
        function initEvents() {
            // Bouton Étape 1 -> 2
            document.getElementById('step1-next').addEventListener('click', function() {
                if (!this.disabled) showStep(2);
            });

            // Bouton Étape 2 -> 3
            document.getElementById('step2-next').addEventListener('click', function() {
                showStep(3);
            });

            // Type de toner
            document.querySelectorAll('.type-btn[data-type]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.type-btn[data-type]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedTonerType = this.dataset.type;
                    updatePrice();
                });
            });

            // Type de livraison
            document.querySelectorAll('.type-btn[data-delivery]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.type-btn[data-delivery]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedDelivery = this.dataset.delivery;
                    updateAddressField();
                });
            });

            // Quantité
            document.getElementById('quantity').addEventListener('change', updatePrice);
            document.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = document.getElementById('quantity');
                    let val = parseInt(input.value) || 1;
                    if (this.classList.contains('plus')) {
                        val = Math.min(val + 1, MAX_QUANTITY);
                    } else {
                        val = Math.max(val - 1, 1);
                    }
                    input.value = val;
                    updatePrice();
                });
            });

            // Submit
            document.getElementById('submitBtn').addEventListener('click', handleSubmit);
        }

        function updateAddressField() {
            const addressGroup = document.getElementById('address-group');
            if (selectedDelivery === 'point_relais') {
                addressGroup.style.display = 'none';
            } else {
                addressGroup.style.display = 'block';
            }
        }

        // ========================================
        // ENVOI DE LA COMMANDE
        // ========================================
        async function handleSubmit() {
            if (isSubmitting) return;
            
            // Validation
            const fullname = document.getElementById('fullname').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const wilaya = document.getElementById('order-wilaya').value;
            const commune = document.getElementById('order-commune').value;
            const address = document.getElementById('address').value.trim();
            
            if (!fullname) { showStatus('error', 'Veuillez entrer votre nom complet'); return; }
            if (!phone || phone.length < 9) { showStatus('error', 'Veuillez entrer un numéro de téléphone valide'); return; }
            if (!wilaya) { showStatus('error', 'Veuillez sélectionner votre wilaya'); return; }
            if (!commune) { showStatus('error', 'Veuillez sélectionner votre commune'); return; }
            if (selectedDelivery === 'domicile' && !address) { showStatus('error', 'Veuillez entrer votre adresse complète'); return; }
            
            isSubmitting = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            
            try {
                // Récupérer les données
                const qty = parseInt(document.getElementById('quantity').value) || 1;
                const type = selectedTonerType === 'original' ? 'Original' : 'Compatible';
                const marque = document.getElementById('marque-selectionnee').value;
                const modele = document.getElementById('modele-selectionne').value;
                const tonerData = JSON.parse(document.getElementById('step2-next').dataset.toner || '{}');
                const total = document.getElementById('total-display').textContent;
                
                const wilayaName = WILAYA_NAMES.find(w => w.wilaya_id == wilaya)?.wilaya_name_latin || '';
                const communeName = WILAYA_DATAS.communes?.find(c => c.commune_id == commune)?.commune_name_latin || '';
                
                const orderData = {
                    fullname: sanitizeInput(fullname),
                    phone: sanitizeInput(phone),
                    wilaya: sanitizeInput(wilayaName),
                    commune: sanitizeInput(communeName),
                    address: sanitizeInput(address) || 'Point relais',
                    marque: sanitizeInput(marque),
                    modele: sanitizeInput(modele),
                    toner: sanitizeInput(tonerData.nom || ''),
                    code: sanitizeInput(tonerData.code || ''),
                    type: type,
                    quantite: qty,
                    total: total,
                    livraison: selectedDelivery === 'domicile' ? 'Domicile' : 'Point relais'
                };
                
                // Envoyer par email
                const emailResult = await emailjs.send(
                    EMAILJS_CONFIG.service_id,
                    EMAILJS_CONFIG.template_id,
                    orderData
                );
                
                console.log('Email envoyé:', emailResult);
                
                // Envoyer vers Google Sheets si configuré
                if (CATALOG.sheets_post_url && CATALOG.sheets_post_url.includes('VOTRE_ID')) {
                    console.log('Sheets URL non configuré');
                } else if (CATALOG.sheets_post_url) {
                    try {
                        await fetch(CATALOG.sheets_post_url, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify(orderData)
                        });
                    } catch (e) {
                        console.log('Sheets error:', e);
                    }
                }
                
                // Afficher la célébration
                showCelebration(orderData);
                
            } catch (error) {
                console.error('Erreur:', error);
                showStatus('error', '⚠️ Une erreur est survenue. Veuillez réessayer ou nous contacter par WhatsApp.');
            } finally {
                isSubmitting = false;
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        // ========================================
        // CÉLÉBRATION
        // ========================================
        function showCelebration(data) {
            const overlay = document.getElementById('celebration-overlay');
            const summary = document.getElementById('order-summary');
            
            summary.innerHTML = `
                <div class="line"><span>👤 Client</span><span>${data.fullname}</span></div>
                <div class="line"><span>📦 Produit</span><span>${data.marque} - ${data.toner}</span></div>
                <div class="line"><span>🔧 Type</span><span>${data.type}</span></div>
                <div class="line"><span>📄 Quantité</span><span>${data.quantite}</span></div>
                <div class="line"><span>🚚 Livraison</span><span>${data.livraison}</span></div>
                <div class="line"><span>📍 Wilaya</span><span>${data.wilaya}</span></div>
                <div class="line"><span>💰 Total</span><span>${data.total}</span></div>
            `;
            
            overlay.style.display = 'flex';
            
            // Confettis
            launchConfetti();
            
            // Feux d'artifice (simplifiés)
            launchFireworks();
        }

        function closeCelebration() {
            document.getElementById('celebration-overlay').style.display = 'none';
            document.getElementById('confetti-container').innerHTML = '';
            // Réinitialiser le formulaire
            document.getElementById('order-form').reset();
            document.getElementById('marque-selectionnee').value = '';
            document.getElementById('modele-selectionne').value = '';
            document.getElementById('recherche-modele').disabled = true;
            document.getElementById('step1-next').disabled = true;
            showStep(1);
            // Réinitialiser le prix
            UNIT_PRICE = 0;
            document.getElementById('product-name').textContent = 'Toner Compatible';
            document.getElementById('product-price').textContent = '0 DA';
            document.getElementById('product-rendement').textContent = '';
            document.getElementById('product-desc').textContent = 'Sélectionnez votre imprimante pour trouver le toner compatible';
            document.getElementById('compat-list').innerHTML = '';
            document.getElementById('subtotal-display').textContent = '0 DA';
            document.getElementById('total-display').textContent = '0 DA';
            document.getElementById('discount-line').style.display = 'none';
        }

        // ========================================
        // CONFETTIS
        // ========================================
        function launchConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#F5D742', '#F47920', '#1A4C27', '#E74C3C', '#3498DB', '#9B59B6'];
            
            for (let i = 0; i < 100; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.width = (Math.random() * 8 + 4) + 'px';
                el.style.height = (Math.random() * 8 + 4) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                el.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(el);
            }
            
            // Nettoyer après 5 secondes
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // ========================================
        // FEUX D'ARTIFICE (Canvas simplifié)
        // ========================================
        function launchFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#F5D742', '#F47920', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
            
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 4 + 2;
                    this.speedX = (Math.random() - 0.5) * 8;
                    this.speedY = (Math.random() - 0.5) * 8;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.speedY += 0.05;
                    this.life -= this.decay;
                    this.size *= 0.99;
                }
                
                draw() {
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            function createBurst(x, y) {
                for (let i = 0; i < 60; i++) {
                    particles.push(new Particle(x, y));
                }
            }
            
            let frameCount = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (frameCount % 15 === 0) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height * 0.6;
                    createBurst(x, y);
                }
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0 || particles[i].size < 0.5) {
                        particles.splice(i, 1);
                    }
                }
                
                frameCount++;
                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            animate();
        }

        // ========================================
        // INITIALISATION
        // ========================================
        document.addEventListener('DOMContentLoaded', function() {
            // Mettre à jour l'étape 2
            updateStep2();
            
            // Initialiser les événements
            initEvents();
            
            // Charger les données
            loadData();
        });

        function updateStep2() {
            // Mettre à jour le nombre de toners
            const compatibleSub = document.getElementById('compatible-sub');
            const originalSub = document.getElementById('original-sub');
            if (CATALOG && CATALOG.marques) {
                const count = CATALOG.marques.reduce((acc, m) => acc + (m.toners?.length || 0), 0);
                compatibleSub.textContent = `${count} références disponibles`;
                originalSub.textContent = `+ de ${count} références`;
            }
        }

        // Mettre à jour la taille du canvas
        window.addEventListener('resize', function() {
            const canvas = document.getElementById('fireworks-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>

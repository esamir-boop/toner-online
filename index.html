<script>
        // ========================================
        // CONFIGURATION GLOBALE
        // ========================================
        let CATALOG = null;
        let WILAYA_DATAS = {};
        let WILAYA_NAMES = [];
        let UNIT_PRICE = 0;
        let DISCOUNT_PER_EXTRA = 500;
        let MAX_QUANTITY = 10;
        let selectedTonerType = 'compatible';
        let selectedDelivery = 'domicile';
        let allModeles = [];
        let isSubmitting = false;
        let formStartTime = Date.now();

        const EMAILJS_CONFIG = {
            public_key: 'tc8CLfJDs3E9-EIQ3',
            service_id: 'service_hguu30b',
            template_id: 'template_cx2lh99'
        };

        // ========================================
        // UTILITAIRES
        // ========================================
        function normalizeAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        function sanitizeInput(input) {
            if (!input) return '';
            const element = document.createElement('div');
            element.textContent = input;
            return element.innerHTML;
        }

        function debounce(fn, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        function showStatus(type, msg) {
            const el = document.getElementById('statusMessage');
            if (!el) return;
            el.className = 'status-msg ' + type;
            el.textContent = msg;
        }

        // ========================================
        // CHARGEMENT DES DONNÉES
        // ========================================
        async function loadData() {
            try {
                // Charger le catalogue
                const catalogResponse = await fetch('data.json');
                if (!catalogResponse.ok) throw new Error('Impossible de charger le catalogue');
                CATALOG = await catalogResponse.json();
                DISCOUNT_PER_EXTRA = CATALOG.remise?.par_quantite || 500;
                MAX_QUANTITY = CATALOG.remise?.quantite_max || 10;
                
                const discountInfo = document.getElementById('discount-info');
                if (discountInfo) {
                    discountInfo.textContent = 
                        `Réduction de ${DISCOUNT_PER_EXTRA} DA par quantité supplémentaire (max ${MAX_QUANTITY})`;
                }

                // Charger les wilayas
                const wilayaResponse = await fetch('cities.json');
                if (!wilayaResponse.ok) throw new Error('Impossible de charger les wilayas');
                const wilayaData = await wilayaResponse.json();
                WILAYA_DATAS = wilayaData;
                WILAYA_NAMES = wilayaData.wilayas || [];

                // Construire la liste des modèles
                buildModelList();

                // Initialiser les champs
                initWilayaSelect();
                initSearchFields();
                
                // Mettre à jour l'affichage du produit
                updateProductDisplayDefault();

                document.getElementById('step1-next').disabled = false;

            } catch (error) {
                console.error('Erreur:', error);
                showStatus('error', '⚠️ Erreur de chargement: ' + error.message);
            }
        }

        function buildModelList() {
            allModeles = [];
            if (!CATALOG || !CATALOG.marques) return;
            
            CATALOG.marques.forEach(marque => {
                if (!marque.toners) return;
                marque.toners.forEach(toner => {
                    if (!toner.compatibles) return;
                    toner.compatibles.forEach(model => {
                        allModeles.push({
                            marque: marque.nom,
                            modele: model,
                            toner: toner,
                            marqueObj: marque
                        });
                    });
                });
            });
        }

        function updateProductDisplayDefault() {
            // Afficher le premier toner par défaut si disponible
            if (allModeles.length > 0) {
                const first = allModeles[0];
                updateProductDisplay(first.marque, first.modele, first.toner);
            }
        }

        // ========================================
        // WILAYAS & COMMUNES
        // ========================================
        function initWilayaSelect() {
            const select = document.getElementById('order-wilaya');
            if (!select) return;
            
            select.innerHTML = '<option value="">Sélectionnez votre wilaya</option>';
            WILAYA_NAMES.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.wilaya_id;
                opt.textContent = w.wilaya_name_latin;
                select.appendChild(opt);
            });
            select.addEventListener('change', function() {
                loadCommunes(this.value);
            });
        }

        function loadCommunes(wilayaId) {
            const communeSelect = document.getElementById('order-commune');
            const loading = document.getElementById('communeLoading');
            
            if (!communeSelect) return;
            
            communeSelect.innerHTML = '<option value="">Sélectionnez une commune</option>';
            
            if (!wilayaId) {
                communeSelect.disabled = true;
                return;
            }
            
            communeSelect.disabled = true;
            if (loading) loading.style.display = 'block';
            
            setTimeout(() => {
                const communes = WILAYA_DATAS.communes?.filter(c => c.wilaya_id == wilayaId) || [];
                communes.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.commune_id;
                    opt.textContent = c.commune_name_latin || c.commune_name_arabic;
                    communeSelect.appendChild(opt);
                });
                communeSelect.disabled = false;
                if (loading) loading.style.display = 'none';
            }, 300);
        }

        // ========================================
        // RECHERCHE
        // ========================================
        function initSearchFields() {
            // Référence
            const refInput = document.getElementById('recherche-reference');
            const refSuggest = document.getElementById('suggestions-reference');
            
            if (refInput) {
                refInput.addEventListener('input', debounce(function() {
                    const val = this.value.trim();
                    if (val.length < 2) {
                        if (refSuggest) refSuggest.style.display = 'none';
                        return;
                    }
                    const results = searchByReference(val);
                    if (refSuggest) {
                        showSuggestions(refSuggest, results.map(r => ({
                            label: `${r.toner.nom} (${r.toner.code}) - ${r.marque}`,
                            sub: r.modele,
                            data: { marque: r.marque, modele: r.modele, toner: r.toner }
                        })), (item) => {
                            selectToner(item.data);
                            if (refSuggest) refSuggest.style.display = 'none';
                            refInput.value = item.label;
                        });
                        refSuggest.style.display = results.length > 0 ? 'block' : 'none';
                    }
                }, 300));
            }

            // Marque
            const marqueInput = document.getElementById('recherche-marque');
            const marqueSuggest = document.getElementById('suggestions-marque');
            
            if (marqueInput) {
                marqueInput.addEventListener('input', debounce(function() {
                    const val = this.value.trim();
                    if (val.length < 2) {
                        if (marqueSuggest) marqueSuggest.style.display = 'none';
                        const modeleInput = document.getElementById('recherche-modele');
                        if (modeleInput) modeleInput.disabled = true;
                        return;
                    }
                    const marques = getMarquesFiltered(val);
                    if (marqueSuggest) {
                        showSuggestions(marqueSuggest, marques.map(m => ({
                            label: m.nom,
                            sub: `${m.toners?.length || 0} toners disponibles`,
                            data: { marque: m }
                        })), (item) => {
                            const marqueSelect = document.getElementById('marque-selectionnee');
                            if (marqueSelect) marqueSelect.value = item.data.marque.nom;
                            marqueInput.value = item.data.marque.nom;
                            if (marqueSuggest) marqueSuggest.style.display = 'none';
                            enableModeleSearch(item.data.marque);
                        });
                        marqueSuggest.style.display = marques.length > 0 ? 'block' : 'none';
                    }
                }, 300));
            }

            // Modèle
            const modeleInput = document.getElementById('recherche-modele');
            const modeleSuggest = document.getElementById('suggestions-modele');
            
            if (modeleInput) {
                modeleInput.addEventListener('input', debounce(function() {
                    const val = this.value.trim();
                    const marqueSelect = document.getElementById('marque-selectionnee');
                    const marque = marqueSelect ? marqueSelect.value : '';
                    if (val.length < 2 || !marque) {
                        if (modeleSuggest) modeleSuggest.style.display = 'none';
                        return;
                    }
                    const results = searchModels(val, marque);
                    if (modeleSuggest) {
                        showSuggestions(modeleSuggest, results.map(r => ({
                            label: r.modele,
                            sub: `${r.toner.nom} - ${r.toner.code}`,
                            data: { marque: r.marque, modele: r.modele, toner: r.toner }
                        })), (item) => {
                            selectToner(item.data);
                            if (modeleSuggest) modeleSuggest.style.display = 'none';
                            modeleInput.value = item.data.modele;
                        });
                        modeleSuggest.style.display = results.length > 0 ? 'block' : 'none';
                    }
                }, 300));
            }

            // Clic en dehors des suggestions
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#suggestions-reference')) {
                    const refSuggest = document.getElementById('suggestions-reference');
                    if (refSuggest) refSuggest.style.display = 'none';
                }
                if (!e.target.closest('#suggestions-marque')) {
                    const marqueSuggest = document.getElementById('suggestions-marque');
                    if (marqueSuggest) marqueSuggest.style.display = 'none';
                }
                if (!e.target.closest('#suggestions-modele')) {
                    const modeleSuggest = document.getElementById('suggestions-modele');
                    if (modeleSuggest) modeleSuggest.style.display = 'none';
                }
            });
        }

        function searchByReference(query) {
            const q = query.toLowerCase().trim();
            const results = [];
            allModeles.forEach(item => {
                const code = (item.toner.code || '').toLowerCase();
                const nom = (item.toner.nom || '').toLowerCase();
                if (code.includes(q) || nom.includes(q)) {
                    results.push(item);
                }
            });
            return results.slice(0, 15);
        }

        function getMarquesFiltered(query) {
            const q = query.toLowerCase().trim();
            return (CATALOG.marques || []).filter(m => 
                m.nom.toLowerCase().includes(q) || 
                (m.aliases || []).some(a => a.toLowerCase().includes(q))
            );
        }

        function searchModels(query, marque) {
            const q = query.toLowerCase().trim();
            return allModeles.filter(item => 
                item.marque.toLowerCase() === marque.toLowerCase() &&
                item.modele.toLowerCase().includes(q)
            ).slice(0, 15);
        }

        function enableModeleSearch(marque) {
            const modeleInput = document.getElementById('recherche-modele');
            if (!modeleInput) return;
            modeleInput.disabled = false;
            modeleInput.placeholder = `Rechercher un modèle ${marque.nom}...`;
            modeleInput.value = '';
            const modeleSuggest = document.getElementById('suggestions-modele');
            if (modeleSuggest) modeleSuggest.style.display = 'none';
        }

        function showSuggestions(container, items, onSelect) {
            if (!container) return;
            container.innerHTML = '';
            if (items.length === 0) {
                container.style.display = 'none';
                return;
            }
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.innerHTML = `<span>${item.label}</span><span class="sub-info">${item.sub || ''}</span>`;
                div.addEventListener('click', () => onSelect(item));
                container.appendChild(div);
            });
            container.style.display = 'block';
        }

        function selectToner(data) {
            const { marque, modele, toner } = data;
            
            // Mettre à jour les champs
            const marqueSelect = document.getElementById('marque-selectionnee');
            const modeleSelect = document.getElementById('modele-selectionne');
            const marqueInput = document.getElementById('recherche-marque');
            const modeleInput = document.getElementById('recherche-modele');
            
            if (marqueSelect) marqueSelect.value = marque;
            if (modeleSelect) modeleSelect.value = modele;
            if (marqueInput) marqueInput.value = marque;
            if (modeleInput) modeleInput.value = modele;
            
            // Mettre à jour le produit
            updateProductDisplay(marque, modele, toner);
            
            // Activer le bouton continuer
            const nextBtn = document.getElementById('step1-next');
            if (nextBtn) nextBtn.disabled = false;
            
            // Passer à l'étape 2 automatiquement après un court délai
            setTimeout(() => {
                showStep(2);
            }, 500);
        }

        // ========================================
        // AFFICHAGE PRODUIT
        // ========================================
        function updateProductDisplay(marque, modele, toner) {
            const nom = document.getElementById('product-name');
            const code = document.getElementById('product-code');
            const price = document.getElementById('product-price');
            const rendement = document.getElementById('product-rendement');
            const desc = document.getElementById('product-desc');
            const compat = document.getElementById('compat-list');
            
            if (nom) nom.textContent = `${marque} - ${toner.nom}`;
            if (code) code.textContent = `Réf: ${toner.code}`;
            if (rendement) rendement.textContent = `📄 Rendement: ${toner.rendement}`;
            if (desc) desc.textContent = `Compatible avec ${modele}`;
            
            // Prix
            UNIT_PRICE = toner.prix_compatible || 7500;
            if (price) price.textContent = `${UNIT_PRICE.toLocaleString('fr-FR')} DA`;
            
            // Compatibilités
            if (compat) {
                compat.innerHTML = '';
                if (toner.compatibles) {
                    toner.compatibles.forEach(m => {
                        const span = document.createElement('span');
                        span.textContent = m;
                        compat.appendChild(span);
                    });
                }
            }
            
            // Stocker les données
            const step2Next = document.getElementById('step2-next');
            if (step2Next) {
                step2Next.dataset.toner = JSON.stringify(toner);
                step2Next.dataset.marque = marque;
                step2Next.dataset.modele = modele;
            }
            
            updatePrice();
        }

        // ========================================
        // GESTION DES ÉTAPES
        // ========================================
        function showStep(step) {
            // Cacher tous les steps
            document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
            // Afficher le step demandé
            const target = document.getElementById(`step${step}`);
            if (target) target.classList.add('active');
            
            // Mettre à jour la barre de progression
            document.querySelectorAll('.step-item').forEach(el => {
                const num = parseInt(el.dataset.step);
                el.classList.remove('active', 'done');
                if (num === step) el.classList.add('active');
                else if (num < step) el.classList.add('done');
            });
            
            // Mettre à jour le prix si on est à l'étape 2
            if (step === 2) updatePrice();
            
            // Scroll en haut du formulaire
            const form = document.querySelector('.order-form');
            if (form) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ========================================
        // GESTION DU PRIX
        // ========================================
        function updatePrice() {
            const qtyInput = document.getElementById('quantity');
            const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
            const type = selectedTonerType;
            
            // Si UNIT_PRICE est 0, essayer de récupérer un prix par défaut
            let basePrice = UNIT_PRICE;
            if (basePrice === 0) {
                const priceEl = document.getElementById('product-price');
                if (priceEl) {
                    const priceText = priceEl.textContent.replace(/[^0-9]/g, '');
                    basePrice = parseInt(priceText) || 7500;
                }
            }
            
            if (type === 'original') {
                basePrice = basePrice * 2.2;
            }
            
            let total = basePrice * qty;
            let discount = 0;
            
            if (qty > 1) {
                discount = (qty - 1) * DISCOUNT_PER_EXTRA;
                total = total - discount;
                if (total < 0) total = 0;
            }
            
            const subtotalDisplay = document.getElementById('subtotal-display');
            if (subtotalDisplay) {
                subtotalDisplay.textContent = `${Math.round(basePrice * qty).toLocaleString('fr-FR')} DA`;
            }
            
            const discountLine = document.getElementById('discount-line');
            const discountDisplay = document.getElementById('discount-display');
            if (discount > 0) {
                if (discountLine) discountLine.style.display = 'flex';
                if (discountDisplay) discountDisplay.textContent = `-${discount.toLocaleString('fr-FR')} DA`;
            } else {
                if (discountLine) discountLine.style.display = 'none';
            }
            
            const totalDisplay = document.getElementById('total-display');
            if (totalDisplay) {
                totalDisplay.textContent = `${Math.round(total).toLocaleString('fr-FR')} DA`;
                
                // Animation
                totalDisplay.classList.remove('price-blink');
                void totalDisplay.offsetWidth;
                totalDisplay.classList.add('price-blink');
            }
        }

        // ========================================
        // GESTION DES ÉVÉNEMENTS
        // ========================================
        function initEvents() {
            // Bouton Étape 1 -> 2
            const step1Next = document.getElementById('step1-next');
            if (step1Next) {
                step1Next.addEventListener('click', function() {
                    if (!this.disabled) showStep(2);
                });
            }

            // Bouton Étape 2 -> 3
            const step2Next = document.getElementById('step2-next');
            if (step2Next) {
                step2Next.addEventListener('click', function() {
                    showStep(3);
                });
            }

            // Type de toner
            document.querySelectorAll('.type-btn[data-type]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.type-btn[data-type]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedTonerType = this.dataset.type;
                    updatePrice();
                });
            });

            // Type de livraison
            document.querySelectorAll('.type-btn[data-delivery]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.type-btn[data-delivery]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedDelivery = this.dataset.delivery;
                    updateAddressField();
                });
            });

            // Quantité
            const quantityInput = document.getElementById('quantity');
            if (quantityInput) {
                quantityInput.addEventListener('change', updatePrice);
            }
            
            document.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = document.getElementById('quantity');
                    if (!input) return;
                    let val = parseInt(input.value) || 1;
                    if (this.classList.contains('plus')) {
                        val = Math.min(val + 1, MAX_QUANTITY);
                    } else {
                        val = Math.max(val - 1, 1);
                    }
                    input.value = val;
                    updatePrice();
                });
            });

            // Submit
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.addEventListener('click', handleSubmit);
            }
        }

        function updateAddressField() {
            const addressGroup = document.getElementById('address-group');
            if (addressGroup) {
                if (selectedDelivery === 'point_relais') {
                    addressGroup.style.display = 'none';
                } else {
                    addressGroup.style.display = 'block';
                }
            }
        }

        // ========================================
        // ENVOI DE LA COMMANDE
        // ========================================
        async function handleSubmit() {
            if (isSubmitting) return;
            
            // Validation
            const fullname = document.getElementById('fullname');
            const phone = document.getElementById('phone');
            const wilaya = document.getElementById('order-wilaya');
            const commune = document.getElementById('order-commune');
            const address = document.getElementById('address');
            
            if (!fullname || !fullname.value.trim()) { 
                showStatus('error', 'Veuillez entrer votre nom complet'); 
                return; 
            }
            if (!phone || !phone.value.trim() || phone.value.trim().length < 9) { 
                showStatus('error', 'Veuillez entrer un numéro de téléphone valide'); 
                return; 
            }
            if (!wilaya || !wilaya.value) { 
                showStatus('error', 'Veuillez sélectionner votre wilaya'); 
                return; 
            }
            if (!commune || !commune.value) { 
                showStatus('error', 'Veuillez sélectionner votre commune'); 
                return; 
            }
            if (selectedDelivery === 'domicile' && (!address || !address.value.trim())) { 
                showStatus('error', 'Veuillez entrer votre adresse complète'); 
                return; 
            }
            
            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) submitBtn.disabled = true;
            
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) loadingOverlay.style.display = 'flex';
            
            try {
                // Récupérer les données
                const qtyInput = document.getElementById('quantity');
                const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
                const type = selectedTonerType === 'original' ? 'Original' : 'Compatible';
                const marqueSelect = document.getElementById('marque-selectionnee');
                const marque = marqueSelect ? marqueSelect.value : '';
                const modeleSelect = document.getElementById('modele-selectionne');
                const modele = modeleSelect ? modeleSelect.value : '';
                
                const step2Next = document.getElementById('step2-next');
                let tonerData = {};
                if (step2Next && step2Next.dataset.toner) {
                    try {
                        tonerData = JSON.parse(step2Next.dataset.toner);
                    } catch (e) {}
                }
                
                const totalDisplay = document.getElementById('total-display');
                const total = totalDisplay ? totalDisplay.textContent : '0 DA';
                
                const wilayaName = WILAYA_NAMES.find(w => w.wilaya_id == wilaya.value)?.wilaya_name_latin || '';
                const communeName = WILAYA_DATAS.communes?.find(c => c.commune_id == commune.value)?.commune_name_latin || '';
                
                const orderData = {
                    fullname: sanitizeInput(fullname.value.trim()),
                    phone: sanitizeInput(phone.value.trim()),
                    wilaya: sanitizeInput(wilayaName),
                    commune: sanitizeInput(communeName),
                    address: sanitizeInput(address ? address.value.trim() : '') || 'Point relais',
                    marque: sanitizeInput(marque),
                    modele: sanitizeInput(modele),
                    toner: sanitizeInput(tonerData.nom || ''),
                    code: sanitizeInput(tonerData.code || ''),
                    type: type,
                    quantite: qty,
                    total: total,
                    livraison: selectedDelivery === 'domicile' ? 'Domicile' : 'Point relais'
                };
                
                // Envoyer par email
                await emailjs.send(
                    EMAILJS_CONFIG.service_id,
                    EMAILJS_CONFIG.template_id,
                    orderData
                );
                
                // Envoyer vers Google Sheets si configuré
                if (CATALOG && CATALOG.sheets_post_url && CATALOG.sheets_post_url.includes('VOTRE_ID')) {
                    console.log('Sheets URL non configuré');
                } else if (CATALOG && CATALOG.sheets_post_url) {
                    try {
                        await fetch(CATALOG.sheets_post_url, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify(orderData)
                        });
                    } catch (e) {
                        console.log('Sheets error:', e);
                    }
                }
                
                // Afficher la célébration
                showCelebration(orderData);
                
            } catch (error) {
                console.error('Erreur:', error);
                showStatus('error', '⚠️ Une erreur est survenue. Veuillez réessayer ou nous contacter par WhatsApp.');
            } finally {
                isSubmitting = false;
                if (submitBtn) submitBtn.disabled = false;
                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) loadingOverlay.style.display = 'none';
            }
        }

        // ========================================
        // CÉLÉBRATION
        // ========================================
        function showCelebration(data) {
            const overlay = document.getElementById('celebration-overlay');
            const summary = document.getElementById('order-summary');
            
            if (!overlay || !summary) return;
            
            summary.innerHTML = `
                <div class="line"><span>👤 Client</span><span>${data.fullname}</span></div>
                <div class="line"><span>📦 Produit</span><span>${data.marque} - ${data.toner}</span></div>
                <div class="line"><span>🔧 Type</span><span>${data.type}</span></div>
                <div class="line"><span>📄 Quantité</span><span>${data.quantite}</span></div>
                <div class="line"><span>🚚 Livraison</span><span>${data.livraison}</span></div>
                <div class="line"><span>📍 Wilaya</span><span>${data.wilaya}</span></div>
                <div class="line"><span>💰 Total</span><span>${data.total}</span></div>
            `;
            
            overlay.style.display = 'flex';
            
            // Confettis
            launchConfetti();
            
            // Feux d'artifice
            launchFireworks();
        }

        function closeCelebration() {
            const overlay = document.getElementById('celebration-overlay');
            if (overlay) overlay.style.display = 'none';
            
            const confettiContainer = document.getElementById('confetti-container');
            if (confettiContainer) confettiContainer.innerHTML = '';
            
            // Réinitialiser le formulaire
            const form = document.getElementById('order-form');
            if (form) form.reset();
            
            const marqueSelect = document.getElementById('marque-selectionnee');
            if (marqueSelect) marqueSelect.value = '';
            
            const modeleSelect = document.getElementById('modele-selectionne');
            if (modeleSelect) modeleSelect.value = '';
            
            const modeleInput = document.getElementById('recherche-modele');

            if (step1Next) step1Next.disabled = true;
            
            showStep(1);
            
            // Réinitialiser le prix
            UNIT_PRICE = 0;

            if (productName) productName.textContent = 'Toner Compatible';

        // ========================================
        // CONFETTIS
        // ========================================
        function launchConfetti() {
            const container = document.getElementById('confetti-container');
            if (!container) return;
            container.innerHTML = '';
            const colors = ['#F5D742', '#F47920', '#1A4C27', '#E74C3C', '#3498DB', '#9B59B6'];
            
            for (let i = 0; i < 100; i++) {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.left = Math.random() * 100 + '%';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.width = (Math.random() * 8 + 4) + 'px';
                el.style.height = (Math.random() * 8 + 4) + 'px';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                el.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(el);
            }
            
            // Nettoyer après 5 secondes
            setTimeout(() => {
                if (container) container.innerHTML = '';
            }, 5000);
        }

        // ========================================
        // FEUX D'ARTIFICE
        // ========================================
        function launchFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#F5D742', '#F47920', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
            
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 4 + 2;
                    this.speedX = (Math.random() - 0.5) * 8;
                    this.speedY = (Math.random() - 0.5) * 8;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.speedY += 0.05;
                    this.life -= this.decay;
                    this.size *= 0.99;
                }
                
                draw() {
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            function createBurst(x, y) {
                for (let i = 0; i < 60; i++) {
                    particles.push(new Particle(x, y));
                }
            }
            
            let frameCount = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (frameCount % 15 === 0) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height * 0.6;
                    createBurst(x, y);
                }
                
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0 || particles[i].size < 0.5) {
                        particles.splice(i, 1);
                    }
                }
                
                frameCount++;
                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            
            animate();
        }

        // ========================================
        // INITIALISATION
        // ========================================
        document.addEventListener('DOMContentLoaded', function() {
            // Initialiser les événements d'abord
            initEvents();
            
            // Puis charger les données
            loadData();
        });

        // Mettre à jour la taille du canvas
        window.addEventListener('resize', function() {
            const canvas = document.getElementById('fireworks-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
